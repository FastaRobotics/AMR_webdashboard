<!DOCTYPE html>
<html>
<head>
    <title>Robot Camera</title>
</head>
<body>
    <h1>Robot Camera Feed</h1>
    <img id="robot-camera" width="640" height="480"/>

    <script>
        let ws = new WebSocket("ws://localhost:8000/socket/amr_1/ws/subscribe//webcam/image_raw/compressed");
        ws.onmessage = function(event) {
            let data = JSON.parse(event.data);
            let img = document.getElementById("robot-camera");
            img.src = "data:image/jpeg;base64," + data.image;
        };
        ws.onclose = function() {
            console.log("WebSocket closed");
        };
    </script>
</body>
</html>
