<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    margin:40px;
}

.container{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:600px;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    padding:10px;
    margin-top:10px;
}

pre{
    background:#eee;
    padding:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Create User</h2>

<input id="id" placeholder="id">
<input id="first" placeholder="first name">
<input id="last" placeholder="last name">
<input id="email" placeholder="email">
<input id="username" placeholder="username">
<input id="password" type="password" placeholder="password">

<button onclick="createUser()">Create User</button>

<hr>

<h2>Login</h2>

<input id="loginUser" placeholder="username">
<input id="loginPass" type="password" placeholder="password">

<button onclick="login()">Login</button>

<hr>

<h2>Get User</h2>

<input id="userId" placeholder="user id">
<button onclick="getUser()">Get User</button>

<pre id="output"></pre>

</div>

<script>

let authHeader = ""

function createUser(){

    const data = {
        id: parseInt(document.getElementById("id").value),
        first_name: document.getElementById("first").value,
        last_name: document.getElementById("last").value,
        email: document.getElementById("email").value,
        user_name: document.getElementById("username").value,
        password: document.getElementById("password").value
    }

    fetch("http://localhost:8000/user/create",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    })
    .then(r=>r.json())
    .then(d=>{
        document.getElementById("output").textContent = JSON.stringify(d,null,2)
    })
}

function login(){

    const username = document.getElementById("loginUser").value
    const password = document.getElementById("loginPass").value

    authHeader = "Basic " + btoa(username + ":" + password)

    document.getElementById("output").textContent = "Logged in as " + username
}

function getUser(){

    const id = document.getElementById("userId").value

    fetch("http://localhost:8000/user/" + id,{
        headers:{
            "Authorization":authHeader
        }
    })
    .then(r=>r.json())
    .then(d=>{
        document.getElementById("output").textContent = JSON.stringify(d,null,2)
    })

}

</script>

</body>
</html>
